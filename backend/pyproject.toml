[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aeolus-wra"
version = "0.1.0"
description = "Wind resource analysis platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "python-multipart>=0.0.20,<1",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wind_platform.core" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["../tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
